version: "3.5"

networks:
  openstates-network:
      name: openstates-network
      external: true

volumes:
  openstates-postgres:
    name: openstates-postgres

services:
  django:
    build:
      context: .
      dockerfile: docker/uwsgi/Dockerfile
      args:
        UID: 1000
    volumes:
      - .:/code
    environment:
      # dev settings to reload python files when edited
      - UWSGI_PYTHON_AUTORELOAD=3
      - UWSGI_ENABLE_THREADS=1
      - DEBUG=True
      - SECRET_KEY
      - DATABASE_URL
      - CACHE_URL
      - RECAPTCHA_PUBLIC_KEY
      - RECAPTCHA_PRIVATE_KEY
    networks:
      - openstates-network

  nginx:
    build: docker/nginx
    ports:
      - "8000:80"
    depends_on:
      - django
    networks:
      - openstates-network

  fastapi:
    build:
      context: .
      dockerfile: fastapi_backend/Dockerfile
    ports:
      - "8001:8001"
      - "9090:9090"
    environment:
      - DEBUG=True
      - DJANGO_BACKEND_URL=http://django:8000
      - OTEL_ENABLED=true
      - OTEL_SERVICE_NAME=openstates-fastapi
      - PROMETHEUS_ENABLED=true
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
    volumes:
      - .:/app
    depends_on:
      - django
    networks:
      - openstates-network

  db:
    profiles:
      - db
    image: postgres
    environment:
      POSTGRES_DATABASE: openstatesorg
      POSTGRES_PASSWORD: openstates
      POSTGRES_USER: openstates
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - 5405:5432

  # webpack:
  #   build: .
  #   command: ./docker/webpack-start.sh
  #   volumes:
  #     - .:/code
